<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourtSense — Volleyball Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(98% 0.004 250);
  --ink: oklch(20% 0.02 260);
  --muted: oklch(55% 0.015 260);
  --border: oklch(91% 0.006 255);
  --primary: oklch(58% 0.19 265);
  --primary-dark: oklch(48% 0.19 265);
  --primary-soft: oklch(94% 0.03 265);
  --card: #fff;
  --green: oklch(62% 0.15 150);
  --red: oklch(60% 0.18 25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }

.topbar { height: 60px; display: flex; align-items: center; gap: 28px; padding: 0 28px; background: var(--card); border-bottom: 1px solid var(--border); }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center; }
.logo-mark div { width: 11px; height: 11px; border-radius: 50%; background: #fff; }
.logo-name { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }

.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
.subtitle { color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 32px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 100%; max-width: 560px; }
label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; margin-top: 18px; }
label:first-of-type { margin-top: 0; }
input[type=text], select {
  width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--ink); font-size: 13.5px; font-family: inherit; font-weight: 500;
}
input[type=text]:focus, select:focus { outline: none; border-color: var(--primary); }
.check-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-top: 18px; }
.check-label input { accent-color: var(--primary); }
button {
  margin-top: 24px; width: 100%; padding: 12px; background: var(--primary); color: #fff;
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: background 0.15s;
}
button:hover { background: var(--primary-dark); }
button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
.status { margin-top: 18px; padding: 13px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; display: none; }
.status.running { background: oklch(95% 0.04 150); border: 1px solid oklch(88% 0.06 150); color: var(--green); display: block; }
.status.error   { background: oklch(95% 0.03 25); border: 1px solid oklch(88% 0.05 25); color: var(--red); display: block; }
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--green); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.hint { margin-top: 12px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">
    <div class="logo-mark"><div></div></div>
    <div class="logo-name">CourtSense</div>
  </div>
</div>

<div class="hero">
  <h1>Volleyball Analytics</h1>
  <p class="subtitle">Upload match footage — ball tracking, poses, rallies &amp; contact events</p>
  <div class="card">
    <label>Video file path</label>
    <input type="text" id="videoPath" placeholder="C:/path/to/game.mp4" value="data/processed/ball_extraction_results/original_images_video.mp4">

    <label>Processing speed</label>
    <select id="skipFrames">
      <option value="0" selected>Every frame (recommended: skeletons + heatmap)</option>
      <option value="1">Every 2nd frame (faster)</option>
      <option value="2">Every 3rd frame (fast)</option>
      <option value="4">Every 5th frame (fastest)</option>
    </select>

    <label class="check-label">
      <input type="checkbox" id="refreshNetFloor" checked>
      Refresh SAM3 net-post bases (enable for a new camera angle)
    </label>

    <button id="analyzeBtn" onclick="startAnalysis()">Analyze Video</button>

    <div class="status" id="statusBox">
      <span class="spinner" id="spinner"></span>
      <span id="statusText">Starting...</span>
    </div>
    <p class="hint">Analysis runs in background. For a 57s 4K video with skip=1: ~3-5 minutes.</p>
  </div>
</div>

<script>
let pollInterval = null;

function startAnalysis() {
  const path = document.getElementById('videoPath').value.trim();
  const skip = document.getElementById('skipFrames').value;
  const refreshNetFloor = document.getElementById('refreshNetFloor').checked;
  if (!path) return;

  document.getElementById('analyzeBtn').disabled = true;
  showStatus('running', 'Initializing models...');

  fetch('/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      video_path: path,
      skip_frames: parseInt(skip),
      refresh_net_floor: refreshNetFloor,
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { showStatus('error', data.error); return; }
    pollStatus(data.job_id);
  })
  .catch(e => showStatus('error', e.toString()));
}

function pollStatus(jobId) {
  clearInterval(pollInterval);
  pollInterval = setInterval(() => {
    fetch('/status/' + jobId)
      .then(r => r.json())
      .then(job => {
        if (job.status === 'running') {
          showStatus('running', job.message || 'Processing...');
        } else if (job.status === 'done') {
          clearInterval(pollInterval);
          showStatus('running', 'Done! Redirecting...');
          setTimeout(() => { window.location = '/results/' + jobId; }, 800);
        } else if (job.status === 'error') {
          clearInterval(pollInterval);
          showStatus('error', 'Error: ' + job.message);
          document.getElementById('analyzeBtn').disabled = false;
        }
      });
  }, 2000);
}

function showStatus(type, msg) {
  const box = document.getElementById('statusBox');
  box.className = 'status ' + type;
  document.getElementById('statusText').textContent = msg;
  document.getElementById('spinner').style.display = type === 'running' ? 'inline-block' : 'none';
}
</script>
</body>
</html>
