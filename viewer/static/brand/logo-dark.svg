<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-label="CourtSense volleyball analytics">
  <style>.w{font-family:Inter,'Segoe UI',system-ui,sans-serif}</style>
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b74f0"/>
      <stop offset="1" stop-color="#2f40c0"/>
    </linearGradient>
    <clipPath id="cs-ball"><circle r="12"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cs-bg)"/>
  <!-- forearm + open hand, drawn pointing up, tilted toward the ball -->
  <g transform="translate(24 50) rotate(36)" fill="#fff" stroke="#fff" stroke-linecap="round">
    <path d="M-5 0 L-5.6 30 L5.6 30 L5 0 Z" stroke-width="0"/>
    <rect x="-7" y="-14" width="14" height="16" rx="5.5" stroke-width="0"/>
    <line x1="-5.2" y1="-12" x2="-5.6" y2="-22" stroke-width="3.2"/>
    <line x1="-1.7" y1="-12" x2="-1.8" y2="-24.5" stroke-width="3.2"/>
    <line x1="1.8" y1="-12" x2="2" y2="-23.5" stroke-width="3.2"/>
    <line x1="5.2" y1="-11" x2="5.8" y2="-19.5" stroke-width="3"/>
    <line x1="-6" y1="-3.5" x2="-11.5" y2="-9.5" stroke-width="3.4"/>
  </g>
  <!-- ball, ringed in the background colour so it separates from the fingertips -->
  <g transform="translate(43 18)">
    <circle r="13.6" fill="#3a4fd0"/>
    <circle r="12" fill="#fff"/>
    <g clip-path="url(#cs-ball)" fill="none" stroke="#2f40c0" stroke-width="1.6" stroke-linecap="round">
      <g id="cs-seam">
        <path d="M0 0 C4 -2 6 -7 5 -13"/>
        <path d="M9 -9 C9.5 -4 7 0.5 3 3.5"/>
      </g>
      <use href="#cs-seam" transform="rotate(120)"/>
      <use href="#cs-seam" transform="rotate(240)"/>
    </g>
  </g>
  <text class="w" x="78" y="35" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#eef0ff">Court<tspan fill="#8396ff">Sense</tspan></text>
  <text class="w" x="79" y="53" font-size="11" font-weight="600" letter-spacing="2.2" fill="#9aa3d6">VOLLEYBALL ANALYTICS</text>
</svg>
